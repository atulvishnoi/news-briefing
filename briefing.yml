name: Daily news briefing

on:
  schedule:
    - cron: "30 0 * * *"   # 00:30 UTC = 6:00 am IST, every day
  workflow_dispatch:        # adds the "Run workflow" button for manual sends
    inputs:
      hours:
        description: "How many hours of news to cover"
        default: "24"

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python briefing.py --hours "${{ github.event.inputs.hours || '24' }}"
        env:
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
